            const errorMsg = document.getElementById('errorMsg');

            const protectedContent = document.getElementById('protectedContent');
            const downloadBtn = document.getElementById('downloadBtn');

            const feedbackBlock = document.getElementById('feedbackBlock');
            const fbName = document.getElementById('fbName');
            const fbPhone = document.getElementById('fbPhone');
            const fbMessage = document.getElementById('fbMessage');
            const fbError = document.getElementById('fbError');
            const fbSubmit = document.getElementById('fbSubmit');
            const feedbackSuccess = document.getElementById('feedbackSuccess');

            let currentOption = null;

            // فتح صفحة الخيار
            window.openOption = function(key) {
                if (!OPTIONS[key]) return;
                currentOption = key;
                const opt = OPTIONS[key];

                optionTitle.textContent = opt.title;

                // إعادة تعيين
                passwordBlock.classList.add('hidden');
                protectedContent.classList.add('hidden');
                feedbackBlock.classList.add('hidden');
                feedbackSuccess.classList.add('hidden');
                errorMsg.textContent = '';
                fbError.textContent = '';
                passwordInput.value = '';
                fbName.value = '';
                fbPhone.value = '';
                fbMessage.value = '';
                fbSubmit.disabled = false;
                fbSubmit.textContent = 'إرسال';

                if (opt.type === 'protected') {
                    optionSub.textContent = "أدخل كلمة المرور للوصول";
                    passwordBlock.classList.remove('hidden');
                    // ضبط رابط التنزيل
                    downloadBtn.href = DOWNLOAD_LINKS[key] || "#";
                } else {
                    optionSub.textContent = "شاركنا رأيك أو استفسارك";
                    feedbackBlock.classList.remove('hidden');
                }

                homePage.classList.add('hidden');
                optionPage.classList.remove('hidden');
                window.scrollTo({ top: 0, behavior: 'smooth' });

                setTimeout(() => {
                    if (opt.type === 'protected') passwordInput.focus();
                    else fbName.focus();
                }, 140);
            };

            // التحقق من كلمة المرور
            function verifyPassword() {
                if (!currentOption) return;
                const entered = passwordInput.value.trim();

                if (entered === SECRET_PASSWORD) {
                    errorMsg.textContent = '';
                    passwordBlock.classList.add('hidden');
                    protectedContent.classList.remove('hidden');
                } else {
                    errorMsg.textContent = 'كلمة المرور غير صحيحة. حاول مرة أخرى.';
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            }

            // إرسال الفيدباك إلى تيليجرام
            async function submitFeedback() {
                const name = fbName.value.trim();
                const phone = fbPhone.value.trim();
                const message = fbMessage.value.trim();

                if (!name || !phone || !message) {
                    fbError.textContent = 'يرجى ملء جميع الحقول (الاسم، الرقم، التعليق).';
                    return;
                }

                fbError.textContent = '';
                fbSubmit.disabled = true;
                fbSubmit.textContent = 'جاري الإرسال...';

                // بناء نص الرسالة
                const text =
                    "📩 رسالة جديدة من Elhnafy tool hack\n\n" +
                    "👤 الاسم: " + name + "\n" +
                    "📱 الرقم: " + phone + "\n" +
                    "💬 التعليق/الاستفسار:\n" + message;

                try {
                    const url = "https://api.telegram.org/bot" + TELEGRAM_BOT_TOKEN + "/sendMessage";
                    const response = await fetch(url, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            chat_id: TELEGRAM_CHAT_ID,
                            text: text
                        })
                    });

                    const data = await response.json();

                    if (data.ok) {
                        feedbackBlock.classList.add('hidden');
                        feedbackSuccess.classList.remove('hidden');
                    } else {
                        fbError.textContent = 'تعذر إرسال الرسالة. تأكد من صحة إعدادات البوت.';
                        fbSubmit.disabled = false;
                        fbSubmit.textContent = 'إرسال';
                    }
                } catch (err) {
                    fbError.textContent = 'حدث خطأ في الاتصال. تحقق من اتصالك بالإنترنت.';
                    fbSubmit.disabled = false;
                    fbSubmit.textContent = 'إرسال';
                }
            }

            // العودة للرئيسية
            function goBack() {
                optionPage.classList.add('hidden');
                homePage.classList.remove('hidden');
                currentOption = null;
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            // الأحداث
            verifyBtn.addEventListener('click', verifyPassword);

            passwordInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    verifyPassword();
                }
            });

            fbSubmit.addEventListener('click', submitFeedback);
            backBtn.addEventListener('click', goBack);

            // الحالة الابتدائية
            optionPage.classList.add('hidden');
            homePage.classList.remove('hidden');
        })();
    </script>
</body>
</html>
